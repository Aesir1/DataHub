schema {
  query: Query
  mutation: Mutation
}

"Every non-abstract subclass is registered as an extension of the Query type (source-generated registration, see GraphQlSetup)."
type Query {
  containers(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ContainerFilterInput @cost(weight: "10")
    order: [ContainerSortInput!] @cost(weight: "10")
  ): ContainersConnection
    @authorize(policy: "containers.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Min/max/avg/latest reading of one container (SQL view ContainerSummaries)."
  containerSummary(containerId: UUID!): ContainerSummary
    @authorize(policy: "containers.read")
    @cost(weight: "10")
  "Readings of one container, oldest first."
  temperatures(
    containerId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): TemperaturesConnection
    @authorize(policy: "containers.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 100
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "Own documents (all for platform-admin) with a 5-minute presigned download URL."
  documents(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: DocumentFilterInput @cost(weight: "10")
    order: [DocumentSortInput!] @cost(weight: "10")
  ): DocumentsConnection
    @authorize(policy: "documents.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  document(id: UUID!): Document
    @authorize(policy: "documents.read")
    @cost(weight: "10")
  queues: [QueueInfo!]! @authorize(policy: "queues.manage") @cost(weight: "10")
  products(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ProductFilterInput @cost(weight: "10")
    order: [ProductSortInput!] @cost(weight: "10")
  ): ProductsConnection
    @authorize(policy: "products.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  product(id: UUID!): Product
    @authorize(policy: "products.read")
    @cost(weight: "10")
  "Changes of one product as recorded by the audit consumer, newest first."
  productAudit(
    productId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): ProductAuditConnection
    @authorize(policy: "products.read")
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  "The signed-in user, so the UI can show only what the caller may use."
  viewer: Viewer!
}

"Every non-abstract subclass is registered as an extension of the Mutation type (source-generated registration, see GraphQlSetup)."
type Mutation {
  "Creates a Pending document and returns a presigned PUT URL valid 10 minutes (max 25 MB, allow-listed types)."
  requestDocumentUpload(input: RequestDocumentUploadInput!): RequestDocumentUploadPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  confirmDocumentUpload(input: ConfirmDocumentUploadInput!): ConfirmDocumentUploadPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  renameDocument(input: RenameDocumentInput!): RenameDocumentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  replaceDocumentContent(input: ReplaceDocumentContentInput!): ReplaceDocumentContentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  deleteDocument(input: DeleteDocumentInput!): DeleteDocumentPayload!
    @authorize(policy: "documents.write")
    @cost(weight: "10")
  "Declares a durable queue bound to domain-events with its own dead-letter queue."
  declareQueue(input: DeclareQueueInput!): DeclareQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
  "Removes every ready message; returns how many."
  purgeQueue(input: PurgeQueueInput!): PurgeQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
  deleteQueue(input: DeleteQueueInput!): DeleteQueuePayload!
    @authorize(policy: "queues.manage")
    @cost(weight: "10")
  createProduct(input: CreateProductInput!): CreateProductPayload!
    @authorize(policy: "products.write")
    @cost(weight: "10")
  "Pass the rowVersion you read; a concurrent change returns ConcurrencyError."
  updateProduct(input: UpdateProductInput!): UpdateProductPayload!
    @authorize(policy: "products.write")
    @cost(weight: "10")
  deleteProduct(input: DeleteProductInput!): DeleteProductPayload!
    @authorize(policy: "products.write")
    @cost(weight: "10")
}

type ConcurrencyError implements Error {
  message: String!
  code: String!
}

